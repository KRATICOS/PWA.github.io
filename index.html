<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="./css/style.css">

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Iconos para dispositivos Apple -->
    <link rel="apple-touch-icon" href="./images/icons/cafe1.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe2.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe3.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe4.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe5.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe6.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe7.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe8.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe9.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe10.png">

    <meta name="apple-mobile-web-app-status-bar" content="#db4938">
    <meta name="theme-color" content="#db4938">

    <title>Coffee PWA</title>

</head>

<body>

    <main>

        <nav>
            <h1>Coffee PWA</h1>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>

        <div class="container"></div>

    </main>

    <script src="./js/app.js"></script>

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("./serviceworker.js")

                    .then(() => {
                        console.log("Service Worker registrado correctamente");
                    })

                    .catch(error => {
                        console.error("Error al registrar el Service Worker:", error);
                    });

            });

        }

    </script>

</body>

</html>
