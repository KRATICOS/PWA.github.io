
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Estilos -->
    <link rel="stylesheet" href="./CSS/style.css">

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Iconos para dispositivos Apple -->
    <link rel="apple-touch-icon" href="./images/icons/cafe1.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe2.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe3.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe4.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe5.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe6.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe7.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe8.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe9.png">
    <link rel="apple-touch-icon" href="./images/icons/cafe10.png">

    <meta name="apple-mobile-web-app-status-bar" content="#db4938">
    <meta name="theme-color" content="#db4938">

    <title>Coffee PWA</title>
</head>

<body>

    <main>

        <nav>
            <h1>Coffee PWA</h1>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>

        <div class="container"></div>

    </main>

    <!-- JavaScript de la aplicación -->
    <script src="./js/app.js"></script>

    <!-- Registro del Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    const registro = await navigator.serviceWorker.register(
                        "./serviceworker.js"
                    );

                    console.log(
                        "Service Worker registrado correctamente:",
                        registro.scope
                    );

                    await registro.update();
                } catch (error) {
                    console.error(
                        "Error al registrar el Service Worker:",
                        error
                    );
                }
            });
        }
    </script>

</body>

</html>
